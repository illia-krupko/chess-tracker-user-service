services:
  user-service:
    build: .
    restart: on-failure

    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_service_db

    networks:
      - gateway-user-service
      - user-service-postgres

networks:
  gateway-user-service:
    external: true

  user-service-postgres:
    external: true
